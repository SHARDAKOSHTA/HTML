<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributes and nth child pseudo selectors.</title>

<style>
    .container{
       
        display: block;
        width:233px;
margin: auto;
    }
input{
    display: block;
}
input[type='text']{
padding:23px;
border: 2px solid red;
}
a[target='_self']{
    font-size: 30px;
    color: blue;
}
input[type='email']{
    color: yellow;
    border: 4px solid black;
}
li:nth-child(3){
    color: green;
}
</style>
</head>
<body>
    <div class="container">
        <h1><a href="http://google.com" target="_blank">Go To Google</a></h1>
         <h1><a href="http://facebook.com" target="_self">Go To Facebook</a></h1>
        <form action="" class="form-control">
         
            <input type="text" placeholder="Enter your name : ">
                   <input type="email" placeholder="Enter your email : ">
             <input type="text" placeholder="Enter your password : ">
             <input type="submit" value="submit">
        </form> 
        <ul>
            <li class="item" id="item-1">Item-1</li>
            <li class="item" id="item-2">Item-2</li>
            <li class="item" id="item-3">Item-3</li>
            <li class="item" id="item-4">Item-4</li>
            <li class="item" id="item-5">Item-5</li>
             <li class="item" id="item-1">Item-6</li>
            <li class="item" id="item-2">Item-7</li>
            <li class="item" id="item-3">Item-8</li>
            <li class="item" id="item-4">Item-9</li>
            <li class="item" id="item-5">Item-10</li>
        </ul>
    </div>
</body>
</html>
