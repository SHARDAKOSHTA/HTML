<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility & Z-idx property</title>
    <style>
        .box{
            width: 170px;
            height:140px;
            border: 2px solid black;

        }
        #box1{
            background-color: green;
            position: relative;
        top: 49px;
        }
         #box2{
            /* display: will hide the element the space */
            /* display: none; */

            /* visibility: will hide the element but will show its empty space */
            /* visibility: hidden; */

            /* z-idx will work only for position ,absolute,fixed or stickly. */

            position: relative;
            top: 14px;
            z-index: -1;
            background-color: red;
        }
         #box3{
            background-color: blue;
        }
         #box4{
            background-color:  rgb(211, 10, 87);
         }
    </style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
</body>
</html>
