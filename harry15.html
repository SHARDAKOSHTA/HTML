<head>
    <meta charset="UTF-8">

    <title>Height,width,border and background</title>
    <style>
#para{
    background-color: cadetblue;
    height: 50px;
    width:500px;
    /* border-radius: green;

    border:4px solid yellow;
    border-radius: 11px;
}
#secpara{
    background-color: red;

     border-bottom: 4px solid yellow;

}

}

</head>

    <h3>This is heading</h3>
