<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math objects</title>
</head>
<body>
    <div class="container">
       <h1> This is math object tutorial.</h1>
    </div>
    <script>

        // math objecct


let m=Math;
console.log(m);
console.log("the value of Math.E is : ",Math.E);
console.log("the value of Math.pi is : ",Math.PI);
console.log("the value of Math.LN2 is : ",Math.LN2);
console.log("the value of Math.SQRT1_2 is : ",Math.SQRT1_2);
console.log("the value of Math.LOG2E is : ",Math.LOG2E);

// functions

let a=34.64534;
let b=89;
console.log("the val of a and b is : ",a,b);
console.log("the val of a and b rounded is : ",Math.round(a),Math.round(b));

console.log("3 raised to power of 2 is : ",Math.pow(3,2));
console.log("2 raised to power of 12 is : ",Math.pow(2,12));

console.log("squre root of 36 is : ",Math.sqrt(36));
console.log("squre root of 12 is : ",Math.sqrt(12));
console.log("squre root of 50 is : ",Math.sqrt(50));

console.log("rounded up to nearest int is : ",Math.ceil(5.8));
console.log("rounded down to nearest int is : ",Math.floor(8.6));

console.log("absoulate val is : ",Math.abs(5.666));
console.log("absoulate val is  : ",Math.abs(-5.66));

console.log("the val of sin(pi) is : ",Math.sin(Math.PI/2));
console.log("the val of tan(pi) is : ",Math.tan(Math.PI/2));
console.log("the val of cos(pi) is : ",Math.cos(Math.PI/2));

console.log("min val is ",Math.min(4,5,6));
console.log("min val is ",Math.max(4,5,6));

let r=Math.random();
let a1=1;
let b1=100;
let r1_100=a1+(b1-a1)*Math.random();
console.log("The random no is : ",r);
console.log(r1_100);
    </script>
</body>
</html>
